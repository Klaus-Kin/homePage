<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080f20" />
    <meta
      name="description"
      content="程序猿的月光宝盒。此间有故事，亦有远方。把热爱写进代码，把故事交给月光。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 样式独立于模块脚本加载，开发模式禁用 JavaScript 时也保留完整静态页面。 -->
    <link rel="stylesheet" href="/src/style.css" />
    <title>程序猿的月光宝盒</title>
    <style>
      /* 首屏关键样式不依赖 CSS 或模块下载，隐藏内容仍保留尺寸供相机计算。 */
      html, body { margin: 0; background: #080f20; }
      #app[data-state="loading"] { visibility: hidden; }
      /* 主场景先在幕布后显示；inert 由启动守卫维护，拉开完成前不接受鼠标和键盘输入。 */
      #app[data-revealing="true"] { visibility: visible; }
      #moon-loader { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; overflow: hidden; isolation: isolate; color: #cbb77f; }
      /* 中线保留两像素重叠，避免不同缩放比例下透出未就绪的主画面。 */
      #moon-loader .loader-curtain { position: absolute; inset-block: 0; width: calc(50% + 1px); z-index: -1; background: #080f20; }
      #moon-loader .loader-curtain-left { left: 0; }
      #moon-loader .loader-curtain-right { right: 0; }
      #moon-loader.revealing .loader-curtain-left { animation: curtain-open-left 1000ms cubic-bezier(.76, 0, .24, 1) both; }
      #moon-loader.revealing .loader-curtain-right { animation: curtain-open-right 1000ms cubic-bezier(.76, 0, .24, 1) both; }
      /* 金箍和欢迎语先淡出，随后从中线显露主场景；旋转仍使用既有合成层。 */
      #moon-loader.revealing .hoop-halo, #moon-loader.revealing .hoop-rotor, #moon-loader.revealing .loading-label { opacity: 0; transition: opacity 140ms ease-out; }
      /* 静态柔光与旋转层分开绘制，避免 SVG 滤镜阻断合成线程旋转。 */
      #moon-loader .hoop-halo { grid-area: 1 / 1; width: 142px; height: 142px; margin: -15px; background: radial-gradient(ellipse, #c99d3515 15%, #c99d3509 46%, transparent 70%); }
      #moon-loader .hoop-rotor { grid-area: 1 / 1; width: 112px; height: 112px; animation: hoop-spin 1.8s linear infinite; will-change: transform; }
      #moon-loader .hoop-rotor svg { display: block; width: 112px; height: 112px; }
      /* 小篆字形只定义一次供主页复用；标点仍按原文本和字号显示。 */
      .seal-character { display: inline-block; width: 1em; height: 1em; margin-inline-end: .12em; vertical-align: -.12em; }
      .seal-character svg { display: block; width: 100%; height: 100%; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      /* 欢迎语与金箍分别占据网格行，始终可见，减少动态时保持相同布局。 */
      /* 欢迎语字号增至 24px，提高行书细笔画的可读性，窄屏仍完整居中显示。 */
      #moon-loader .loading-label { margin-top: 24px; font: 24px/1.5 serif; letter-spacing: .18em; }
      /* 行书轮廓继承原金色；尺寸来自离线字框，不添加字体声明或影响金箍动画。 */
      #moon-loader .loading-calligraphy { display: block; margin-block: .25em; overflow: visible; }
      @media (forced-colors: active) {
        /* SVG 没有浏览器的文字对比底板；只切换静态行书，首屏即显示同一份原生文本和系统配色底板。 */
        .description .calligraphy-copy, .journey-link .calligraphy-copy, #moon-loader .loading-calligraphy { display: none; }
        .sr-only.calligraphy-text { position: static; width: auto; height: auto; margin: 0; overflow: visible; clip: auto; white-space: normal; color: CanvasText; background: Canvas; }
        .journey-link .calligraphy-text { color: LinkText; }
      }
      @keyframes hoop-spin { to { transform: rotate(360deg); } }
      @keyframes curtain-open-left { from { transform: translateX(0); } to { transform: translateX(-100%); } }
      @keyframes curtain-open-right { from { transform: translateX(0); } to { transform: translateX(100%); } }
      @keyframes loader-fade-out { from { opacity: 1; } to { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #moon-loader .hoop-rotor { animation: none; will-change: auto; }
        /* 减少动态时不移动整屏幕布，只保留短淡出并沿用同一就绪门禁。 */
        #moon-loader.revealing .loader-curtain { animation: none; }
        /* 覆盖全站减少动态规则的 animation: none，仅允许无位移的短淡出。 */
        #moon-loader.revealing { animation: loader-fade-out 120ms ease-out both !important; }
      }
    </style>
    <noscript
      ><style>
        /* 无脚本无需等待场景，加载层直接退出。 */
        #moon-loader { display: none; }
        /* 无脚本时直接展示静态页面；提高优先级，兼容构建后样式链接顺序变化。 */
        html #app[data-state="loading"] {
          visibility: visible;
        }
        #app .scene-fallback {
          display: block;
        }
        #app #static-box,
        #app .noscript-entry {
          display: block;
        }
        #app #box-button,
        #app #status {
          display: none;
        }
      </style></noscript
    >
  </head>
  <body>
    __MOON_SEAL_GLYPHS__
    __MOON_CALLIGRAPHY_GLYPHS__
    <!-- 金箍直接内联，Three.js 尚未下载时也有独立、可访问的加载反馈。 -->

      <!-- 静态图由同一新场景导出，只在 WebGL 失败或禁用脚本时显示。 -->

        <!-- 原生链接独立于主模块；位置跟随截图平面缩放，脚本失效时仍能点击宝盒。 -->

          href="#journey-choices"
          aria-label="提示选择旅程入口"
        ></a>
      </div>
      <section class="intro fade-content" aria-labelledby="page-title">
        <p class="eyebrow"><span></span> A LITTLE CODE. A LITTLE MAGIC.</p>

        <p class="description">
          __MOON_DESCRIPTION__
        </p>
        <!-- 两项共用提示动画外层，图标列固定宽度，独立文字层负责悬停动效。 -->
        <nav id="journey-choices" aria-label="选择旅程入口" tabindex="-1">
          <div class="choice-motion">
            <a class="journey-link" href="__MOON_BLOG_URL__" data-entrance="blog">
              <!-- 装饰冠沿用链接本身的可访问名称，空替代文本避免屏幕阅读器重复朗读。 -->
              <span class="entry-icon" aria-hidden="true"><img class="phoenix-crown entry-fallback" src="/assets/phoenix-crown.svg" width="44" height="44" alt="" aria-hidden="true" draggable="false" /></span>
              <span class="entry-copy"
                >__MOON_ENTRANCE__<small>LET THE JOURNEY BEGIN</small></span
              >
            </a>
            <a class="journey-link world-link" href="__MOON_WORLD_URL__" data-entrance="world">
              <!-- 无金箍猴王面容以中轴对称雕刻；双眼只响应此链接的悬停或键盘聚焦。 -->
              <span class="entry-icon" aria-hidden="true">
              <svg class="monkey-face entry-fallback" viewBox="0 0 64 64" fill="none" aria-hidden="true" focusable="false">
                <!-- 后备图与实体共用宽短剪影：五束圆发、低桃形面框、大眼浓眉及收小的圆耳轮。 -->
                <defs>
                  <linearGradient id="monkey-hair-gold" x1="-17" y1="26" x2="18" y2="-25" gradientUnits="userSpaceOnUse"><stop stop-color="#9c7a49"/><stop offset=".52" stop-color="#6f5131"/><stop offset="1" stop-color="#493421"/></linearGradient>
                  <linearGradient id="monkey-face-gold" x1="-12" y1="11" x2="13" y2="-22" gradientUnits="userSpaceOnUse"><stop stop-color="#d0b17a"/><stop offset=".55" stop-color="#b39762"/><stop offset="1" stop-color="#8c6e43"/></linearGradient>
                </defs>
                <!-- 模型坐标直接映射进 64px 视框，透明留白与 WebGL 相同，不改变入口占位。 -->
                <g transform="translate(32 32) scale(1 -1)">
                  <g fill="#967344" stroke="#b18e58" stroke-width=".6">
                    <ellipse cx="-20.2" cy="-.9" rx="3.3" ry="5.1"/><ellipse cx="20.2" cy="-.9" rx="3.3" ry="5.1"/>
                  </g>
                  <g fill="#604426" stroke="#c09b61" stroke-width=".65">
                    <ellipse cx="-21" cy="-.9" rx="1.5" ry="3.2"/><ellipse cx="21" cy="-.9" rx="1.5" ry="3.2"/>
                  </g>
                  <path d="M0 26C1.5 26 4.2 21 5.1 20.7C5.7 20.4 5.2 24.1 6.8 23.6C9.2 22.6 11.1 18.8 11.7 17.5C12.8 16.4 12.3 21 13.9 19.7C18 16 20.2 10.8 20.2 4C20.2-1 19.8-5.5 18.6-8C21.6-10.5 21.2-12 18.2-11.7C21-14.5 19.3-16.2 17.1-15.2C18.3-18.3 15.9-20.1 14.5-19.6C11.9-22.4 5-24.7 0-25.5C-5-24.7-11.9-22.4-14.5-19.6C-15.9-20.1-18.3-18.3-17.1-15.2C-19.3-16.2-21-14.5-18.2-11.7C-21.2-12-21.6-10.5-18.6-8C-19.8-5.5-20.2-1-20.2 4C-20.2 10.8-18 16-13.9 19.7C-12.3 21-12.8 16.4-11.7 17.5C-11.1 18.8-9.2 22.6-6.8 23.6C-5.2 24.1-5.7 20.4-5.1 20.7C-4.2 21-1.5 26 0 26Z" fill="url(#monkey-hair-gold)"/>
                  <path d="M0 7.2C2.5 7.2 5.3 12 10 10.8C15.2 10 17 5.5 15.6 .4C15-3.5 13-5.1 10.7-5.7C9.1-6.2 13.5-9.7 12.5-14.2C11.9-19.2 6-21.6 0-21.6C-6-21.6-11.9-19.2-12.5-14.2C-13.5-9.7-9.1-6.2-10.7-5.7C-13-5.1-15-3.5-15.6 .4C-17 5.5-15.2 10-10 10.8C-5.3 12-2.5 7.2 0 7.2Z" fill="url(#monkey-face-gold)" stroke="#614326" stroke-width=".45"/>
                  <g id="monkey-right-eye">
                    <path d="M2.9 1.5C5 2 9.7 5.8 12.7 3.6C15-1.9 10.8-5.2 6.1-3.8C3.7-3 3-.5 2.9 1.5Z" fill="#88603a"/>
                    <path class="monkey-eye" d="M3.8 1.15C6.1 1.6 9.8 4.4 11.9 2.8C13.2-1.2 10.4-3.2 7-2.8C4.9-2.5 3.9-.9 3.8 1.15Z" fill="#cfb582"/>
                    <ellipse cx="7.6" cy="-.15" rx="1.85" ry="2.3" fill="#302015"/>
                    <ellipse cx="7.15" cy=".8" rx=".35" ry=".42" fill="#ead6a8"/>
                    <path d="M2.6 1.1C4.9 .9 9.3 4 12 4.4C14 4.7 13.5 6.1 11.8 6.1C8.9 6 5.1 3.4 2.7 3.1C1.8 2.9 1.7 1.6 2.6 1.1Z" fill="#69482a"/>

              </span>
              <span class="journey-copy entry-copy">__MOON_WORLD__<small>BEYOND THE CODE</small></span>
            </a>
          </div>
        </nav>
      </section>

      <section class="artifact" aria-label="月光宝盒">
        <div id="scene" aria-hidden="true"></div>
        <button
          id="box-button"
          type="button"
          aria-label="提示选择旅程入口"
          aria-controls="journey-choices"
          disabled
        ></button>
      </section>

      <p id="status" class="sr-only" role="status" aria-live="polite">
        正在加载月光宝盒
      </p>
      <div id="whiteout" aria-hidden="true">__MOON_INSCRIPTION__</div>
      <!-- 禁用脚本与入口模块失败共用原生入口，不能依赖主模块注册事件。 -->
      <div class="noscript-entry">
        月光静好。<a href="__MOON_BLOG_URL__">进入博客 →</a>
      </div>
    </main>
    <script>
      // 此守卫不导入任何模块，入口及其静态依赖失败时也能结束隐藏状态。
      (() => {
        const app = document.querySelector("#app");
        let phase = "loading";
        let revealComplete, finishReveal = () => {};
        const timeout = window.setTimeout(() => fail("页面初始化超时"), 10000);
        function stopWatching() {
          clearTimeout(timeout);
          window.removeEventListener("error", onError, true);
        }
        function fail(reason) {
          if (phase !== "loading") return;
          phase = "failed";
          stopWatching();
          app.classList.add("fallback", "boot-failed");
          app.dataset.state = "idle";
          document.querySelector("#moon-loader")?.remove();
          document.querySelector("#status").textContent =
            "已启用静态场景，请选择文字入口开启旅程";
          // 主模块若已部分运行，通知它释放资源并锁定降级，迟到的初始化不得切回 3D。
          window.dispatchEvent(new Event("moon-boot-failed"));
          console.warn("月光页面启动失败，已恢复静态入口：", reason);
        }
        function onError(event) {
          // 构建工具可能重写入口标签及 id，因此按模块脚本类型识别资源失败。
          if (
            (event.target instanceof HTMLScriptElement &&
              event.target.type === "module") ||
            event instanceof ErrorEvent
          )
            fail(event.message || "入口模块加载失败");
        }
        window.__moonBoot = {
          get failed() {
            return phase === "failed";
          },
          ready(immediate = false) {
            if (phase === "failed") return Promise.resolve(false);
            // 重复就绪通知共享同一段转场；运行时降级可以立即解除已有的幕布门禁。
            if (phase !== "loading") {
              if (immediate) finishReveal();
              return revealComplete;
            }
            phase = "revealing";
            stopWatching();
            const loader = document.querySelector("#moon-loader");
            const motion = window.matchMedia("(prefers-reduced-motion: reduce)");
            let revealTimeout = 0;
            revealComplete = new Promise((resolve) => {
              finishReveal = () => {
                if (phase !== "revealing") return;
                phase = "ready";
                clearTimeout(revealTimeout);
                loader?.removeEventListener("animationend", onRevealEnd);
                motion.removeEventListener("change", finishReveal);
                window.removeEventListener("pagehide", finishReveal);
                loader?.remove();
                app.inert = false;
                delete app.dataset.revealing;
                resolve(true);
              };
            });
            function onRevealEnd(event) {
              // 金箍与欢迎语的事件不会提前结束转场，只接受右幕布或减少动态淡出的结束。
              if (event.animationName === "curtain-open-right" ||
                  (event.target === loader && event.animationName === "loader-fade-out")) finishReveal();
            }
            app.inert = true;
            app.dataset.revealing = "true";
            if (!loader || immediate) finishReveal();
            else {
              loader.addEventListener("animationend", onRevealEnd);
              motion.addEventListener("change", finishReveal);
              window.addEventListener("pagehide", finishReveal, { once: true });
              // 动画被浏览器取消时也有出口；后台节流不会留下永久阻挡主页的透明层。
              revealTimeout = window.setTimeout(finishReveal, motion.matches ? 220 : 1100);
              loader.classList.add("revealing");
            }
            return revealComplete;
          },
        };
        window.addEventListener("error", onError, true);
      })();
    </script>
    <script id="entry-module" type="module" src="/src/main.ts"></script>
  </body>
</html>
