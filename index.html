    <meta

      content="程序猿的月光宝盒。此间有故事，亦有远方。把热爱写进代码，把故事交给月光。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 样式独立于模块脚本加载，开发模式禁用 JavaScript 时也保留完整静态页面。 -->
    <link rel="stylesheet" href="/src/style.css" />
    <title>程序猿的月光宝盒</title>
    <style>
      /* 首屏关键样式不依赖 CSS 或模块下载，隐藏内容仍保留尺寸供相机计算。 */
      html, body { margin: 0; background: #080f20; }
      #app[data-state="loading"] { visibility: hidden; }
      /* 主场景先在幕布后显示；inert 由启动守卫维护，拉开完成前不接受鼠标和键盘输入。 */
      /* 生产外链 CSS 排在内联样式后，必须高于 loading 规则，才能在拉幕过程中真正显露场景。 */
      #app[data-state="loading"][data-revealing="true"] { visibility: visible; }
      #moon-loader { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; overflow: hidden; isolation: isolate; color: #cbb77f; }
      /* 缓存恢复先显示独立加载画面，再刷新；旧光幕、题词和出站黑壳不能参与恢复首帧。 */
      html[data-moon-returning="true"] #app { visibility: hidden !important; }
      html[data-moon-returning="true"] #ink-transition { display: none !important; }
      html[data-moon-returning="true"] #moon-loader { z-index: 2147483647; background: #080f20; }
      html[data-moon-returning="true"], html[data-moon-returning="true"] * { cursor: auto !important; }
      /* 前后台切换不消耗开幕时间；暂停范围只覆盖加载层，避免改变主页动画。 */
      #moon-loader.loader-paused, #moon-loader.loader-paused * { animation-play-state: paused !important; }
      /* 一次开幕内减少动态只进不退，避免切回偏好时重新拉幕或被旧的短兜底截断。 */
      #moon-loader.revealing.loader-reduced .loader-curtain { animation: none !important; }
      #moon-loader.revealing.loader-reduced { animation: loader-fade-out 120ms ease-out both !important; }
      /* 中线保留两像素重叠，避免不同缩放比例下透出未就绪的主画面。 */
      #moon-loader .loader-curtain { position: absolute; inset-block: 0; width: calc(50% + 1px); z-index: -1; background: #080f20; }
      #moon-loader .loader-curtain-left { left: 0; }
      #moon-loader .loader-curtain-right { right: 0; }
      /* 首帧就绪门禁保持不变；缩短两侧幕布的移动时间，让准备完成后尽快开放交互。 */
      #moon-loader.revealing .loader-curtain-left { animation: curtain-open-left 450ms cubic-bezier(.76, 0, .24, 1) both; }
      #moon-loader.revealing .loader-curtain-right { animation: curtain-open-right 450ms cubic-bezier(.76, 0, .24, 1) both; }
      /* 金箍和欢迎语先淡出，随后从中线显露主场景；旋转仍使用既有合成层。 */
      #moon-loader.revealing .hoop-halo, #moon-loader.revealing .hoop-rotor, #moon-loader.revealing .loading-label { opacity: 0; transition: opacity 140ms ease-out; }
      /* 静态柔光与旋转层分开绘制，避免 SVG 滤镜阻断合成线程旋转。 */
      #moon-loader .hoop-halo { grid-area: 1 / 1; width: 142px; height: 142px; margin: -15px; background: radial-gradient(ellipse, #c99d3515 15%, #c99d3509 46%, transparent 70%); }
      /* 流式解析可能在紧邻的内联脚本之前先绘制；对齐完成后再显示，避免零角度首帧回跳。 */
      #moon-loader .hoop-rotor { grid-area: 1 / 1; width: 112px; height: 112px; visibility: hidden; animation: hoop-spin 1.8s linear infinite; will-change: transform; }
      #moon-loader .hoop-rotor svg { display: block; width: 112px; height: 112px; }
      /* 小篆字形只定义一次供主页复用；标点仍按原文本和字号显示。 */
      .seal-character { display: inline-block; width: 1em; height: 1em; margin-inline-end: .12em; vertical-align: -.12em; }
      .seal-character svg { display: block; width: 100%; height: 100%; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      /* 欢迎语与金箍分别占据网格行，始终可见，减少动态时保持相同布局。 */
      /* 欢迎语字号增至 24px，提高行书细笔画的可读性，窄屏仍完整居中显示。 */
      #moon-loader .loading-label { margin-top: 24px; font: 24px/1.5 serif; letter-spacing: .18em; }
      /* 行书轮廓继承原金色；尺寸来自离线字框，不添加字体声明或影响金箍动画。 */
      #moon-loader .loading-calligraphy { display: block; margin-block: .25em; overflow: visible; }
      @media (forced-colors: active) {
        /* SVG 没有浏览器的文字对比底板；只切换静态行书，首屏即显示同一份原生文本和系统配色底板。 */
        .description .calligraphy-copy, .journey-link .calligraphy-copy, #moon-loader .loading-calligraphy { display: none; }
        .sr-only.calligraphy-text { position: static; width: auto; height: auto; margin: 0; overflow: visible; clip: auto; white-space: normal; color: CanvasText; background: Canvas; }
        .journey-link .calligraphy-text { color: LinkText; }
      }
      @keyframes hoop-spin { to { transform: rotate(360deg); } }
      @keyframes curtain-open-left { from { transform: translateX(0); } to { transform: translateX(-100%); } }
      @keyframes curtain-open-right { from { transform: translateX(0); } to { transform: translateX(100%); } }
      @keyframes loader-fade-out { from { opacity: 1; } to { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #moon-loader .hoop-rotor { animation: none; will-change: auto; }
        /* 减少动态时不移动整屏幕布，只保留短淡出并沿用同一就绪门禁。 */
        #moon-loader.revealing .loader-curtain { animation: none; }
        /* 覆盖全站减少动态规则的 animation: none，仅允许无位移的短淡出。 */
        #moon-loader.revealing { animation: loader-fade-out 120ms ease-out both !important; }
      }
    </style>
    <noscript
      ><style>
        /* 无脚本无需等待场景，加载层直接退出。 */
        #moon-loader { display: none; }
        /* 无脚本时直接展示静态页面；提高优先级，兼容构建后样式链接顺序变化。 */
        html #app[data-state="loading"] {
          visibility: visible;
        }
        #app .scene-fallback {
          display: block;
        }
        #app #static-box,
        #app .noscript-entry {
          display: block;
        }
        #app #box-button,
        #app #status {
          display: none;
        }
      </style></noscript
    >
  </head>

    __MOON_CALLIGRAPHY_GLYPHS__
    <!-- 金箍直接内联，Three.js 尚未下载时也有独立、可访问的加载反馈。 -->
    <div id="moon-loader" role="status" aria-live="polite" aria-label="正在加载月光宝盒">
      <span class="loader-curtain loader-curtain-left" aria-hidden="true"></span>
      <span class="loader-curtain loader-curtain-right" aria-hidden="true"></span>
      <span class="hoop-halo" aria-hidden="true"></span>
      <span class="hoop-rotor" aria-hidden="true">
      <svg viewBox="0 0 160 160" fill="none" aria-hidden="true">
        <defs><linearGradient id="hoop-gold" x1="28" y1="18" x2="126" y2="143" gradientUnits="userSpaceOnUse"><stop stop-color="#b3812c"/><stop offset=".35" stop-color="#f4dda1"/><stop offset=".65" stop-color="#c99d45"/><stop offset="1" stop-color="#8b5d20"/></linearGradient></defs>
        <path d="M62 129C38 124 22 104 22 79C22 46 47 22 80 22C113 22 138 46 138 79C138 104 122 124 98 129C84 132 81 117 90 112C100 106 110 119 101 124M62 129C76 132 79 117 70 112C60 106 50 119 59 124" stroke="url(#hoop-gold)" stroke-width="7" stroke-linecap="round"/>
        <path d="M57 121C39 113 29 98 29 79C29 51 51 29 80 29C109 29 131 51 131 79C131 98 121 113 103 121" stroke="#f8e9bd" stroke-opacity=".5" stroke-width="1.3"/>
      </svg>
      </span>
      <span class="loading-label">__MOON_LOADING__</span>
    </div>
    <script>
      // 紧随加载层执行，首次绘制前就使用跨文档一致的时间基准，后续旋转仍全部交给 CSS。
      (() => {
        const initialLoader = document.querySelector("#moon-loader");
        const loaderTemplate = initialLoader.cloneNode(true);
        function alignHoop(loader) {
          const rotor = loader.querySelector(".hoop-rotor");
          try {
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
            // getAnimations 会更新样式；只定位金箍，避免改动开幕幕布或淡出的时间轴。
            const spin = rotor?.getAnimations?.()
              .find(animation => animation.animationName === "hoop-spin");
            if (spin) spin.currentTime = (performance.timeOrigin + performance.now()) % 1800;
          } catch {
            // 老浏览器不支持读取或设置动画时间时，沿用 CSS 旋转，不阻塞加载和缓存恢复。
          } finally {
            // 减少动态、缺少动画或 API 异常也要显露图形，不能让兼容性出口留下隐藏金箍。
            if (rotor) rotor.style.visibility = "visible";
          }
        }
        alignHoop(initialLoader);
        window.addEventListener("pageshow", event => {
          if (!event.persisted) return;
          // 同步遮住缓存文档，再刷新已经销毁的场景；入口模块失败时该恢复路径也独立存在。
          document.documentElement.dataset.moonReturning = "true";
          let loader = document.querySelector("#moon-loader");
          if (!loader) { loader = loaderTemplate.cloneNode(true); document.body.prepend(loader); }
          loader.classList.remove("revealing", "loader-paused", "loader-reduced");
          const app = document.querySelector("#app");
          app.dataset.state = "loading";
          delete app.dataset.revealing;
          app.inert = true;
          // 恢复层与刷新后文档各对齐一次，跨过完整旋转周期也不会重新从零起转。
          alignHoop(loader);
          window.location.reload();
        });
      })();
    </script>
    <main id="app" data-state="loading">
      <!-- 静态图由同一新场景导出，只在 WebGL 失败或禁用脚本时显示。 -->
      <div class="scene-fallback">
        <!-- 原生链接独立于主模块；位置跟随截图平面缩放，脚本失效时仍能点击宝盒。 -->
        <a
          id="static-box"
          href="#journey-choices"
          aria-label="提示选择旅程入口"
        ></a>
      </div>
      <section class="intro fade-content" aria-labelledby="page-title">
        <p class="eyebrow"><span></span> A LITTLE CODE. A LITTLE MAGIC.</p>
        <h1 id="page-title"><span>__MOON_TITLE_FIRST__</span><strong>__MOON_TITLE_SECOND__</strong></h1>
        <div class="title-rule" aria-hidden="true"><span></span>✦</div>
        <p class="description">
          __MOON_DESCRIPTION__
        </p>
        <!-- 两项共用提示动画外层，图标列固定宽度，独立文字层负责悬停动效。 -->
        <nav id="journey-choices" aria-label="选择旅程入口" tabindex="-1">
          <div class="choice-motion">
            <a class="journey-link" href="__MOON_BLOG_URL__" data-entrance="blog">
              <!-- 装饰冠沿用链接本身的可访问名称，空替代文本避免屏幕阅读器重复朗读。 -->
              <span class="entry-icon" aria-hidden="true">
                <!-- 透明首帧直接由同一参考图网格导出；短屏优先于手机，像素密度与实时画布对应。 -->
                <span class="entry-fallback">
                  <picture>
                    <source media="(max-height: 600px)" srcset="/assets/entry-crown-30.png 1x, /assets/entry-crown-30@2x.png 2x" />
                    <source media="(max-width: 767px)" srcset="/assets/entry-crown-36.png 1x, /assets/entry-crown-36@2x.png 2x" />
                    <img class="phoenix-crown" src="/assets/entry-crown-44.png" srcset="/assets/entry-crown-44@2x.png 2x" width="70" height="70" alt="" draggable="false" decoding="sync" />
                  </picture>
                </span>
              </span>
              <span class="entry-copy"
                >__MOON_ENTRANCE__<small>TO MY BLOG</small></span
              >
            </a>
            <a class="journey-link world-link" href="__MOON_WORLD_URL__" data-entrance="world">
              <!-- 猴王面容使用参考图曲面；双眼只响应此链接的悬停或键盘聚焦。 -->
              <span class="entry-icon" aria-hidden="true">
                <!-- 静止和红眼图共用模型姿态；后备层与实时画布使用相同透明留白，切换不改造型。 -->
                <span class="entry-fallback">
                  <picture>
                    <source media="(max-height: 600px)" srcset="/assets/entry-monkey-30.png 1x, /assets/entry-monkey-30@2x.png 2x" />
                    <source media="(max-width: 767px)" srcset="/assets/entry-monkey-36.png 1x, /assets/entry-monkey-36@2x.png 2x" />
                    <img class="monkey-face" src="/assets/entry-monkey-44.png" srcset="/assets/entry-monkey-44@2x.png 2x" width="70" height="70" alt="" draggable="false" decoding="sync" />
                  </picture>
                  <!-- 无脚本或 WebGL 故障时仍能平滑显示红眼；实时首帧成功后整层一起隐藏。 -->
                  <picture class="monkey-eye">
                    <source media="(max-height: 600px)" srcset="/assets/entry-monkey-active-30.png 1x, /assets/entry-monkey-active-30@2x.png 2x" />
                    <source media="(max-width: 767px)" srcset="/assets/entry-monkey-active-36.png 1x, /assets/entry-monkey-active-36@2x.png 2x" />
                    <img src="/assets/entry-monkey-active-44.png" srcset="/assets/entry-monkey-active-44@2x.png 2x" width="70" height="70" alt="" draggable="false" decoding="sync" />
                  </picture>
                </span>
              </span>
              <span class="journey-copy entry-copy">__MOON_WORLD__<small>TO MY KOMARI</small></span>
            </a>
          </div>
        </nav>
      </section>

      <section class="artifact" aria-label="月光宝盒">
        <div id="scene" aria-hidden="true"></div>
        <button
          id="box-button"
          type="button"
          aria-label="提示选择旅程入口"
          aria-controls="journey-choices"
          disabled
        ></button>
      </section>

      <p id="status" class="sr-only" role="status" aria-live="polite">
        正在加载月光宝盒
      </p>
      <div id="whiteout" aria-hidden="true">__MOON_INSCRIPTION__</div>
      <!-- 禁用脚本与入口模块失败共用原生入口，不能依赖主模块注册事件。 -->
      <div class="noscript-entry">
        月光静好。<a href="__MOON_BLOG_URL__">进入博客 →</a>
      </div>
    </main>
    <script>
      // 此守卫不导入任何模块，入口及其静态依赖失败时也能结束隐藏状态。
      (() => {
        const app = document.querySelector("#app");
        let phase = "loading";
        let failed = false;
        let revealComplete, finishReveal = () => {};
        let timeout = 0, revealTimeout = 0, revealRaf = 0;
        let active = !document.hidden, remaining = 60000, budgetSince = performance.now();
        let revealRemaining = 0, revealSince = 0, revealingLoader;
        // 使用独立起点记录真实揭幕墙钟，不改变暂停、首帧呈现或动画结束的交互门禁。
        let revealStarted;
        // 每个真实阶段最多等待 20 秒，前台总预算 60 秒；隐藏期间不误判慢设备已卡死。
        function accountBudget() {
          const now = performance.now();
          if (active) remaining -= Math.max(0, now - budgetSince);
          active = !document.hidden;
          budgetSince = now;
        }
        function watchProgress() {
          clearTimeout(timeout);
          accountBudget();
          if (phase === "loading" && active)
            timeout = window.setTimeout(() => fail("页面初始化超时"), Math.max(0, Math.min(20000, remaining)));
        }
        function stopWatching() {
          clearTimeout(timeout);
          window.removeEventListener("error", onError, true);
        }
        function fail(reason) {
          if (phase !== "loading") return;
          failed = true;
          stopWatching();
          app.classList.add("fallback", "boot-failed");
          app.dataset.bootReason = String(reason);
          document.querySelector("#status").textContent =
            "已启用静态场景，请选择文字入口开启旅程";
          // 主模块若已部分运行，通知它释放资源并锁定降级，迟到的初始化不得切回 3D。
          window.dispatchEvent(new Event("moon-boot-failed"));
          console.warn("月光页面启动失败，已恢复静态入口：", reason);
          // 主模块未装载时守卫也能独立完成静态开幕，不把可用性绑定到失败的入口。
          void window.__moonBoot.ready();
        }
        function onError(event) {
          // 构建后入口 id 可能消失；此时退回第一个同源模块，统计脚本和第三方运行错误不能拆幕。
          // 开发服务会提前注入同源热更新模块，存在显式入口时优先使用它，避免错认 Vite 客户端。
          const modules = Array.from(document.scripts).filter(script => script.type === "module" && script.src &&
            new URL(script.src, location.href).origin === location.origin);
          const entry = modules.find(script => script.id === "entry-module") ?? modules[0];
          if (entry && ((event.target instanceof HTMLScriptElement && event.target === entry) ||
              (event instanceof ErrorEvent && event.filename === entry.src)))
            fail(event.message || "入口模块加载失败");
        }
        function armReveal() {
          clearTimeout(revealTimeout);
          if (!document.hidden) {
            revealSince = performance.now();
            revealTimeout = window.setTimeout(finishReveal, revealRemaining);
          }
        }
        window.__moonBoot = {
          get failed() {
            return failed;
          },
          progress(stage) {
            if (phase !== "loading" || failed) return;
            app.dataset.bootStage = stage;
            watchProgress();
          },
          ready() {
            // 正常场景、静态场景和重复通知始终共享开幕，不能用再次 ready 提前解锁。
            if (phase !== "loading") return revealComplete;
            phase = "revealing";
            stopWatching();
            const loader = document.querySelector("#moon-loader");
            const motion = window.matchMedia("(prefers-reduced-motion: reduce)");
            revealComplete = new Promise((resolve) => {
              finishReveal = () => {
                if (phase !== "revealing") return;
                phase = "ready";
                if (revealStarted !== undefined)
                  performance.measure("moon-loader-reveal", { start: revealStarted, end: performance.now() });
                clearTimeout(revealTimeout);
                cancelAnimationFrame(revealRaf);
                loader?.removeEventListener("animationend", onRevealEnd);
                motion.removeEventListener("change", onMotionChange);
                window.removeEventListener("pagehide", finishReveal);
                loader?.remove();
                app.inert = false;
                delete app.dataset.revealing;
                if (failed) app.dataset.state = "idle";
                resolve(!failed);
              };
            });
            function onRevealEnd(event) {
              // 金箍与欢迎语的事件不会提前结束转场，只接受右幕布或减少动态淡出的结束。
              if (event.animationName === "curtain-open-right" ||
                  (event.target === loader && event.animationName === "loader-fade-out")) finishReveal();
            }
            function onMotionChange() {
              // 偏好改变后交给短淡出完成，不能在切换当帧突然撤掉整个加载层。
              if (!motion.matches) return;
              loader?.classList.add("loader-reduced");
              revealRemaining = 220;
              armReveal();
            }
            app.inert = true;
            app.dataset.revealing = "true";
            if (!loader) finishReveal();
            else {
              revealingLoader = loader;
              loader.addEventListener("animationend", onRevealEnd);
              motion.addEventListener("change", onMotionChange);
              window.addEventListener("pagehide", finishReveal, { once: true });
              // 动画被浏览器取消时也有出口；后台节流不会留下永久阻挡主页的透明层。
              // 先给幕后的首帧一次实际呈现机会；兜底从动画启动后计时，不消耗首帧等待时间。
              revealRaf = requestAnimationFrame(() => {
                revealRaf = requestAnimationFrame(() => {
                  if (phase !== "revealing") return;
                  // 正常动画 450ms 加 100ms 兜底余量；减少动态继续沿用原有短淡出与余量。
                  revealRemaining = motion.matches ? 220 : 550;
                  revealStarted = performance.now();
                  if (motion.matches) loader.classList.add("loader-reduced");
                  loader.classList.toggle("loader-paused", document.hidden);
                  loader.classList.add("revealing");
                  armReveal();
                });
              });
            }
            return revealComplete;
          },
        };
        document.addEventListener("visibilitychange", () => {
          if (phase === "loading") watchProgress();
          if (phase !== "revealing" || !revealingLoader) return;
          revealingLoader.classList.toggle("loader-paused", document.hidden);
          if (document.hidden) {
            if (revealSince) revealRemaining = Math.max(0, revealRemaining - (performance.now() - revealSince));
            clearTimeout(revealTimeout);
          } else if (revealRemaining) armReveal();
        });
        window.addEventListener("pagehide", () => { stopWatching(); });
        window.addEventListener("error", onError, true);
