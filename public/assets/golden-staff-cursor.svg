<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 88 88">
  <!-- 保持原始视框并等比例缩小至 72 像素；原生热点 3,3 对准钝圆棒头前缘。 -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#4c2c0d"/>
      <stop offset=".16" stop-color="#d7a540"/>
      <stop offset=".32" stop-color="#fff3bc"/>
      <stop offset=".46" stop-color="#e6bd62"/>
      <stop offset=".66" stop-color="#a96a1d"/>
      <stop offset=".88" stop-color="#61370f"/>
      <stop offset="1" stop-color="#d8a745"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#24160f"/>
      <stop offset=".18" stop-color="#6d3421"/>
      <stop offset=".34" stop-color="#ba7440"/>
      <stop offset=".44" stop-color="#edbd75"/>
      <stop offset=".55" stop-color="#98502e"/>
      <stop offset=".8" stop-color="#4f2418"/>
      <stop offset="1" stop-color="#1c1512"/>
    </linearGradient>
    <radialGradient id="end" cx=".27" cy=".28" r=".8">
      <stop stop-color="#ffe5a0"/>
      <stop offset=".45" stop-color="#b57e2d"/>
      <stop offset=".8" stop-color="#51300f"/>
      <stop offset="1" stop-color="#d7a84c"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-100%" width="170%" height="300%">
      <feDropShadow dx=".8" dy="1.2" stdDeviation=".65" flood-color="#02040b" flood-opacity=".7"/>
    </filter>
    <!-- 龙纹由回卷龙身、角、吻部与爪线组成；两端复用同一纹样，并按透视压缩远端。 -->
    <g id="dragon" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path id="dragon-cut" d="M3 6C4 2 11 1 13 4C16 8 9 11 7 8C4 4 13 2 18 5C22 8 21 13 17 13L14 11M3 6L0 7L2 9L6 8M3 4L2 1M5 3L7 0M11 3L10 0M12 10L10 14L7 15M18 6L22 3M19 9L24 10M18 12L21 15"/>
      <use href="#dragon-cut" stroke="#fff0b2" stroke-width="1.25" transform="translate(0 -.45)" opacity=".7"/>
      <use href="#dragon-cut" stroke="#664015" stroke-width=".9"/>
      <circle cx="3.4" cy="5.5" r=".55" fill="#38220d" stroke="none"/>
    </g>
  </defs>
  <g transform="translate(4 4) rotate(45)" filter="url(#shadow)">
    <!-- 中段用圆柱金属渐变与细高光形成体积，轮廓从远端约 5 像素渐增至近端约 20 像素。 -->
    <path d="M15-2.8L75-7.7L92-9.5Q97-8 97 0Q97 8 92 9.5L75 7.7L15 2.8Z" fill="url(#iron)" stroke="#291b12" stroke-width=".55"/>
    <path d="M25-1.25L75-4.4" stroke="#ffe0a2" stroke-width=".7" opacity=".75"/>
    <path d="M29 1.7L72 4.7" stroke="#2a1710" stroke-width=".65" opacity=".8"/>
    <!-- 远端保留实心棒头的宽度，并用小椭圆端面表现厚度；轮廓向后平缓增粗。 -->
    <path d="M.7-3L27-4.1L27 4.1L.7 3Q-.7 2-.7 0Q-.7-2 .7-3Z" fill="url(#gold)" stroke="#624015" stroke-width=".45"/>
    <path d="M3-1.7L12-1.8L26-2.1" fill="none" stroke="#fff1bb" stroke-width=".6"/>
    <ellipse cx=".7" cy="0" rx="1.4" ry="3" fill="url(#end)" stroke="#e8bf6b" stroke-width=".45"/>
    <path d="M.3-1.9Q-.4-.3 .3.9" fill="none" stroke="#fff0b6" stroke-width=".4" opacity=".8"/>
    <path d="M24-3.9L24 3.9M27-4.1L27 4.1" stroke="#6d4719" stroke-width=".7"/>
    <use href="#dragon" transform="translate(10 -2.2) scale(.5 .29)"/>
    <!-- 近端金箍更宽，龙纹保留更完整的角爪与盘绕龙身，端面椭圆强调朝向镜头的厚度。 -->
    <path d="M73-7.5L94-10.4Q97-8.5 97 0Q97 8.5 94 10.4L73 7.5Z" fill="url(#gold)" stroke="#5d3a12" stroke-width=".55"/>
    <path d="M74-7.5L74 7.5M77-8L77 8M91-10L91 10" stroke="#6d4515" stroke-width=".85"/>
    <path d="M75-7.4L75 7.4M78-7.8L78 7.8M92-9.8L92 9.8" stroke="#fbe2a0" stroke-width=".6" opacity=".8"/>
    <use href="#dragon" transform="translate(78 -6.5) scale(.56 .85)"/>
    <ellipse cx="94.5" cy="0" rx="2.5" ry="10.1" fill="url(#end)" stroke="#e8bf6b" stroke-width=".65"/>
    <ellipse cx="94.6" cy="0" rx="1.25" ry="7.6" fill="none" stroke="#754b18" stroke-width=".55"/>
    <path d="M94-7L95-2M94 1L95 5" stroke="#ffe4a2" stroke-width=".5" opacity=".65"/>
  </g>
</svg>
